version: "1.0"
services:
  db:
    container_name: "db"
    image: postgres:15.1-alpine
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
      - POSTGRES_DB=${DB_NAME}
    restart: always
    ports:
      - "5434:5432"
  db_test:
    container_name: "db_test"
    image: postgres:15.1-alpine
    restart: always
    environment:
      - POSTGRES_USER=${DB_TEST_USER}
      - POSTGRES_PASSWORD=${DB_TEST_PASS}
      - POSTGRES_DB=${TEST_DB_NAME}
    ports:
      - "5435:5432"
